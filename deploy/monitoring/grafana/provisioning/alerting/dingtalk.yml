apiVersion: 1

contactPoints:
  - orgId: 1
    name: in-job-dingtalk
    receivers:
      - uid: in-job-dingtalk-relay
        type: webhook
        disableResolveMessage: false
        settings:
          url: http://server:3000/internal/alerts/dingtalk
          httpMethod: POST
          authorization_scheme: Bearer
          authorization_credentials: $ALERT_RELAY_TOKEN
          maxAlerts: "20"

policies:
  - orgId: 1
    receiver: in-job-dingtalk
    group_by:
      - alertname
      - severity
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
